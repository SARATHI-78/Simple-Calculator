<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <form class = "calculator">
        <div class="form-group"><input type="text"></div>
        <div class="form-group"><button>%</button><button>C</button><button>DEL</button><button>/</button></div>
        <div class="form-group"><button>1</button><button>2</button><button>3</button><button>+</button></div>
        <div class="form-group"><button>4</button><button>5</button><button>6</button><button>-</button></div>
        <div class="form-group"><button>7</button><button>8</button><button>9</button><button>*</button></div>
        <div class="form-group"><button>00</button><button>0</button><button>.</button><button>=</button></div>
    </form>
    <script src = "index.js"></script>
</body>
</html>
